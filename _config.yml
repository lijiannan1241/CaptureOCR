# Site
title: "CaptureOCR"
description: "CaptureOCR turns Windows screenshots into structured text: capture multiple regions, annotate them, and export Markdown or CSV with offline PP-OCRv6 OCR for Chinese, English, and mixed layouts."
url: "https://lijiannan1241.github.io"
baseurl: "/CaptureOCR"

# Language & author
lang: en
author:
  name: "CaptureOCR"
  url: "https://lijiannan1241.github.io/CaptureOCR/"

# Theme
theme: minima

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Collections
collections:
  blog:
    output: true
    permalink: /blog/:title/

# Defaults for collections
defaults:
  - scope:
      path: ""
      type: "blog"
    values:
      layout: "default"
      author: "nannan2008"

# Twitter/X card
twitter:
  card: summary_large_image

# Default OG image
image: "/assets/og-cover.png"

# Search engine verification (uncomment and fill after registering)
# google_site_verification: "your-token"
# bing_site_verification: "your-token"

github_username: lijiannan1241

show_downloads: false

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gemspec"
  - llms.txt
  - blog/index.md  # Blog index is a page, not a post

# Header pages
header_pages:
  - index.md
  - blog/index.md