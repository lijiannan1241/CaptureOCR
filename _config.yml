# Site
title: "CaptureOCR"
description: "Offline CJK OCR for Windows: batch 10+ regions, export Markdown/CSV with coordinates and confidence. $2.99 one-time on Microsoft Store."
url: "https://lijiannan1241.github.io"
baseurl: "/CaptureOCR"

# Language & author
lang: en
author:
  name: "CaptureOCR"
  url: "https://lijiannan1241.github.io/CaptureOCR/"

# Theme
theme: minima

# Plugins (GitHub Pages will run in safe mode automatically; no need to set safe: true)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Social / OG — 如果没有 Twitter 账号，整个块注释掉
# twitter:
#   card: summary_large_image

# Default OG image
image: "/pic2.PNG"

# Search engine verification (uncomment and fill after registering)
# google_site_verification: "your-token"
# bing_site_verification: "your-token"

# GitHub
github_username: lijiannan1241

# Theme UI
show_downloads: false

# Exclude non-site files
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gemspec"
  - llms.txt

# Header nav: uncomment when pages exist
# header_pages:
#   - privacy.md
#   - changelog.md
