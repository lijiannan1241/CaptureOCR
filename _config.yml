# Site
title: "CaptureOCR"
description: "Offline CJK OCR for Windows: batch 10+ regions, export Markdown/CSV with coordinates and confidence. $2.99 one-time on Microsoft Store."
url: "https://lijiannan1241.github.io"
baseurl: "/CaptureOCR"

# Language & author
lang: en
author:
  name: "CaptureOCR"
  url: "https://lijiannan1241.github.io/CaptureOCR/"

# Theme
theme: minima

# Plugins — 不要设置 safe: true，GitHub Pages 线上构建本身即强制安全模式
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# 如果没有 Twitter/X 账号，整块注释掉；否则填入 username
# twitter:
#   card: summary_large_image
#   username: your_handle

# Default OG image
image: "/og-image.png"

# Search engine verification（注册后取消注释并填入 token）
# google_site_verification: "your-token"
# bing_site_verification: "your-token"

github_username: lijiannan1241

show_downloads: false

# 删除 defaults 块：让每个页面在 front matter 中自行声明 layout，避免未来子页面布局被强制覆盖

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gemspec"
  - llms.txt

# header_pages: 等 privacy.md / changelog.md 实际存在后再取消注释
# header_pages:
#   - privacy.md
#   - changelog.md
